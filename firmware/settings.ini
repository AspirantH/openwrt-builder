# Firmware personalization. A section name is what it applies to: [settings] is
# the base for everything, any other section names a build or one device of a
# build (spell devices exactly as builds.ini's `devices =` does). The narrower
# scope wins, and an empty value there is a real override -- that is how one
# device switches off something [settings] turned on.
# Values must not contain single quotes, backslashes, slashes, '#' or '|':
# '#' starts an INI comment and '|' is rejected outright; the others would
# silently break the generated first-boot scripts.
#
# Supported keys (anything else is rejected at build time):
#
# BUILD_BY        Firmware version tag, "built by <value>" appended to the
#                 release description on first boot. Empty = no build tag.
#
# LAN_IP          Default LAN address, e.g. 10.0.0.1. Generates a first-boot
#                 uci-defaults script that rewrites network.lan.ipaddr (prefix
#                 is always /24). Empty = keep OpenWrt's own 192.168.1.1 and
#                 generate no script. NOTE the interaction with the static
#                 network config shipped inside firmware/etc.7z: that file
#                 lands at flash time, this script rewrites the LAN address at
#                 first boot — set LAN_IP only to override it (same value or
#                 empty avoids confusion).
#
# WIFI_SSID       Factory-default wireless, 2.4 GHz + 5 GHz when WIFI_SSID_5G
# WIFI_KEY        is empty (clients roam between bands). Both must be set for
#                 the wireless defaults to be generated at all; with both
#                 empty the firmware carries no preset wireless.
#
# WIFI_SSID_5G    Separate SSID for 5 GHz (overrides WIFI_SSID there). Requires
#                 WIFI_COUNTRY, otherwise the build fails.
#
# WIFI_COUNTRY    Regulatory country code, e.g. CN, US. Only needed when 5 GHz
#                 defaults are generated.
#
# WIFI_ENCRYPTION psk2 (WPA2) / sae (WPA3) / sae-mixed (WPA2+WPA3, the default).
[settings]
# values left empty on purpose: no build tag in the firmware version, no
# factory-default wireless (configure Wi-Fi after first boot)
BUILD_BY        =
WIFI_SSID       =
# One SSID on both bands is the intent, not an oversight: clients then roam
# between 2.4 and 5 GHz on their own. Set WIFI_SSID_5G only to split the bands
# when you want to pin a client to 5 GHz by hand; it overrides WIFI_SSID on
# 5 GHz and needs WIFI_COUNTRY.
WIFI_SSID_5G    =
WIFI_KEY        =
# 5 GHz default wireless needs a country code (mac80211 restriction); empty = 2.4 GHz only
WIFI_COUNTRY    = CN
# wireless encryption: psk2 (WPA2) / sae (WPA3) / sae-mixed (WPA2/WPA3 mixed, the default)
WIFI_ENCRYPTION = sae-mixed
# LAN_IP        =
