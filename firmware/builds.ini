# One section = one product line. The section name is three things at once: the
# release tag prefix (<name>-YYYYMMDD-HHMM, matched exactly), the Actions job
# name, and the config overlay filename firmware/config/<name>.config that gets
# merged over common.config (the overlay is optional; a section without one
# builds from common.config alone).
#
# Supported keys (anything else is rejected at build time):
#
# target   required, format board/subtarget, e.g. x86/64, ramips/mt7621.
#          Feeds CONFIG_TARGET_* and names the image output directory.
#
# devices  optional, space-separated device image ids (as in the target's
#          profile names, e.g. jdcloud_re-cs-02). Selects which profiles are
#          built when set; empty = every profile of the target (x86: the
#          generic image). Each id also opens a per-device scope in
#          settings.ini, and a device id must not double as a build name.
#
# source   optional, owner/repo of the OpenWrt source tree (default
#          openwrt/openwrt). Any GitHub fork works — immortalwrt/immortalwrt,
#          your own fork, etc.
#
# ref      optional, branch|tag|SHA of source (default: the repo's default
#          branch, e.g. master). Resolved to a pinned SHA at plan time, so a
#          build is reproducible even as upstream moves. Can be overridden per
#          run without editing this file via the workflow dispatch inputs
#          (override repo / override ref).
#
# Scheduled builds are skipped when nothing changed: the change-detection
# digest is source-SHA + every packages.ini repo SHA, compared against the
# latest release. A section must not be named [settings] — settings.ini uses
# that name for its global scope.
[x86]
target = x86/64
# ref    = openwrt-25.12
